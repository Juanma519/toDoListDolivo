services:
  mysql:
    image: mysql:8.0
    container_name: todolist_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD no definido}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE no definido}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER no definido}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD no definido}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
